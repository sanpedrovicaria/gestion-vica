<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Parroquial · Ingreso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --brand-navy: #002266;
      --brand-accent: #0055ff;
      --text-main: #1a1c21;
      --text-muted: #5e6673;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      margin: 0;
    }

    .form-control-custom {
      background: #f1f3f7;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      transition: all 0.3s;
    }
    .form-control-custom:focus {
      background: white;
      border-color: var(--brand-accent);
      box-shadow: 0 0 0 4px rgba(0,85,255,0.1);
      outline: none;
    }

    .btn-primary-custom {
      background: var(--brand-navy);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 1rem;
      font-weight: 700;
      width: 100%;
    }
    .btn-primary-custom:disabled { opacity: .7; }

    #login-screen {
      background: var(--brand-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      z-index: 9999;
      padding: 1.5rem;
    }

    .login-card {
      background: white;
      padding: 3.5rem;
      border-radius: 32px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    @media (max-width: 480px) {
      .login-card { padding: 2.25rem 1.75rem; border-radius: 24px; }
    }
  </style>
</head>
<body>

  <!-- ==================== LOGIN ==================== -->
  <div id="login-screen">
    <div class="login-card text-center">
      <div class="mb-4">
        <i class="fas fa-cross fa-3x mb-3" style="color: var(--brand-navy)"></i>
        <h2 class="fw-bold">Bienvenido</h2>
        <p class="text-muted">Acceso al Portal Parroquial</p>
      </div>
      <form onsubmit="iniciarSesion(event)">
        <input type="email" id="username" class="form-control form-control-custom mb-3" placeholder="Correo electrónico" required autocomplete="username">
        <input type="password" id="password" class="form-control form-control-custom mb-4" placeholder="Contraseña" required autocomplete="current-password">
        <div id="login-error" class="alert alert-danger d-none py-2 small rounded-3" role="alert">Credenciales incorrectas</div>
        <button type="submit" id="btn-login" class="btn btn-primary-custom shadow">Ingresar al Sistema</button>
      </form>
    </div>
  </div>

  <script>
    // ====== Configuración de Supabase ======
    const SUPABASE_URL = "https://oajjqfgqbxyquzjunflk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_S0sHD-fWe3kG70fE3SdvSg_c5FxEOY0";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Si ya había una sesión activa, saltamos directo al portal
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) location.href = 'portal.html';
    })();

    async function iniciarSesion(event) {
      event.preventDefault();
      const userField = document.getElementById('username');
      const passField = document.getElementById('password');
      const btnLogin = document.getElementById('btn-login');
      const errorMsg = document.getElementById('login-error');

      const correo = userField.value.trim();
      const clave = passField.value.trim();

      btnLogin.disabled = true;
      btnLogin.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Verificando...`;
      errorMsg.classList.add('d-none');

      const { data, error } = await supabase.auth.signInWithPassword({
        email: correo,
        password: clave
      });

      if (error) {
        errorMsg.textContent = "Credenciales incorrectas o cuenta inactiva.";
        errorMsg.classList.remove('d-none');
        btnLogin.disabled = false;
        btnLogin.innerHTML = "Ingresar al Sistema";
        return;
      }

      location.href = 'portal.html';
    }
  </script>
</body>
</html>
