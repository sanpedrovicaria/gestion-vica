<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Parroquial · Ingreso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="backend.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --brand-navy: #002266;
      --brand-accent: #0055ff;
      --text-main: #1a1c21;
      --text-muted: #5e6673;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      margin: 0;
    }

    .form-control-custom {
      background: #f1f3f7;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      transition: all 0.3s;
    }
    .form-control-custom:focus {
      background: white;
      border-color: var(--brand-accent);
      box-shadow: 0 0 0 4px rgba(0,85,255,0.1);
      outline: none;
    }

    .btn-primary-custom {
      background: var(--brand-navy);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 1rem;
      font-weight: 700;
      width: 100%;
    }
    .btn-primary-custom:disabled { opacity: .7; }

    #login-screen {
      background: var(--brand-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      z-index: 9999;
      padding: 1.5rem;
    }

    .login-card {
      background: white;
      padding: 3.5rem;
      border-radius: 32px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }


    /* Interruptor de fuente de datos */
    .modo-switch { border: 0; padding: 0; margin: 1.75rem 0 0; }
    .modo-legend {
      float: none; width: auto; padding: 0; margin: 0 0 .5rem;
      font-size: .75rem; font-weight: 700; letter-spacing: .4px;
      text-transform: uppercase; color: var(--text-muted);
    }
    .modo-opciones {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      background: #f1f3f7; border-radius: 14px; padding: 4px;
    }
    .modo-label {
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      padding: .6rem .5rem; border-radius: 10px; cursor: pointer;
      font-size: .85rem; font-weight: 600; color: var(--text-muted); white-space: nowrap;
      transition: background .2s, color .2s, box-shadow .2s;
    }
    .modo-label:hover { color: var(--brand-navy); }
    .btn-check:checked + .modo-label {
      background: var(--brand-navy); color: #fff;
      box-shadow: 0 4px 12px rgba(0,34,102,.25);
    }
    .btn-check:focus-visible + .modo-label {
      outline: 3px solid var(--brand-accent); outline-offset: 2px;
    }
    .modo-ayuda { margin: .5rem 0 0; font-size: .75rem; color: var(--text-muted); }

    @media (prefers-reduced-motion: reduce) {
      .modo-label, .form-control-custom { transition: none; }
    }

    @media (max-width: 480px) {
      .login-card { padding: 2.25rem 1.75rem; border-radius: 24px; }
      .modo-label { font-size: .78rem; gap: .35rem; padding: .6rem .25rem; }
    }
  </style>
</head>
<body>

  <!-- ==================== LOGIN ==================== -->
  <div id="login-screen">
    <div class="login-card text-center">
      <div class="mb-4">
        <i class="fas fa-cross fa-3x mb-3" style="color: var(--brand-navy)"></i>
        <h2 class="fw-bold">Bienvenido</h2>
        <p class="text-muted">Acceso al Portal Parroquial</p>
      </div>
      <form onsubmit="iniciarSesion(event)">
        <label class="visually-hidden" for="username" id="label-usuario">Usuario</label>
        <input type="text" id="username" class="form-control form-control-custom mb-3" placeholder="Usuario" required autocomplete="username" autocapitalize="none" spellcheck="false">
        <label class="visually-hidden" for="password">Contraseña</label>
        <input type="password" id="password" class="form-control form-control-custom mb-4" placeholder="Contraseña" required autocomplete="current-password">
        <div id="login-error" class="alert alert-danger d-none py-2 small rounded-3" role="alert">Credenciales incorrectas</div>
        <button type="submit" id="btn-login" class="btn btn-primary-custom shadow">Ingresar al Sistema</button>
      </form>

      <fieldset class="modo-switch text-start" id="modo-switch" hidden>
        <legend class="modo-legend">Fuente de datos</legend>
        <div class="modo-opciones">
          <input type="radio" class="btn-check" name="modo" id="modo-sheets" value="sheets" autocomplete="off">
          <label class="modo-label" for="modo-sheets"><i class="fas fa-table" aria-hidden="true"></i> Google Sheets</label>
          <input type="radio" class="btn-check" name="modo" id="modo-supabase" value="supabase" autocomplete="off">
          <label class="modo-label" for="modo-supabase"><i class="fas fa-database" aria-hidden="true"></i> Supabase</label>
        </div>
        <p class="modo-ayuda" id="modo-ayuda"></p>
      </fieldset>
    </div>
  </div>

  <script>
    const campoUsuario = document.getElementById('username');
    const campoClave = document.getElementById('password');
    const botonLogin = document.getElementById('btn-login');
    const mensajeError = document.getElementById('login-error');

    // Muestra en pantalla el modo activo (texto del campo, radio marcado y ayuda)
    function aplicarModo() {
      const modo = Backend.modo();
      const esSupabase = (modo === 'supabase');

      document.getElementById('modo-' + modo).checked = true;
      campoUsuario.placeholder = esSupabase ? 'Correo electrónico' : 'Usuario';
      campoUsuario.setAttribute('inputmode', esSupabase ? 'email' : 'text');
      document.getElementById('label-usuario').innerText = campoUsuario.placeholder;
      document.getElementById('modo-ayuda').innerText = esSupabase
        ? 'Ingresas con tu correo. Los datos vienen de Supabase.'
        : 'Ingresas con tu usuario. Los datos vienen de Google Sheets.';
      mensajeError.classList.add('d-none');
    }

    // Si ya hay sesión en este modo, pasamos directo al portal
    async function comprobarSesion() {
      const sesion = await Backend.leerSesion();
      if (sesion) location.href = 'portal.html';
    }

    document.querySelectorAll('input[name="modo"]').forEach(function (radio) {
      radio.addEventListener('change', function () {
        Backend.cambiarModo(radio.value);
        aplicarModo();
        comprobarSesion();
      });
    });

    async function iniciarSesion(event) {
      event.preventDefault();

      botonLogin.disabled = true;
      botonLogin.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Verificando...';
      mensajeError.classList.add('d-none');

      const resultado = await Backend.login(campoUsuario.value.trim(), campoClave.value.trim());

      if (!resultado.success) {
        mensajeError.textContent = resultado.message;
        mensajeError.classList.remove('d-none');
        botonLogin.disabled = false;
        botonLogin.innerHTML = 'Ingresar al Sistema';
        return;
      }

      location.href = 'portal.html';
    }

    document.getElementById('modo-switch').hidden = !Backend.permiteSwitch;
    aplicarModo();
    comprobarSesion();
  </script>
</body>
</html>
